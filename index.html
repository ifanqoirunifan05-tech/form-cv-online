<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pembuat CV</title>
    <!-- Pustaka utama untuk cetak PDF -->
    <script src="https://cloudflare.com"></script>
    <style>
        /* Desain Tampilan Form agar Rapi di HP */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 25px; color: #111827; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #4b5563; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button { width: 100%; background-color: #2563eb; color: white; border: none; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }

        /* Desain Hasil Cetak CV PDF (A4) */
        #cv-template { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px; box-sizing: border-box; display: none; color: #222; line-height: 1.6; }
        .cv-header { text-align: center; border-bottom: 3px solid #2563eb; padding-bottom: 15px; margin-bottom: 25px; }
        .cv-header h1 { margin: 0; font-size: 28px; text-transform: uppercase; color: #1e3a8a; letter-spacing: 1px; }
        .cv-header p { margin: 8px 0 0 0; color: #4b5563; font-size: 14px; font-weight: 500; }
        .cv-section { margin-bottom: 25px; }
        .cv-section h3 { margin: 0 0 10px 0; font-size: 18px; color: #1e3a8a; text-transform: uppercase; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
        .cv-section p { margin: 0; font-size: 14px; color: #374151; white-space: pre-line; }
    </style>
</head>
<body>

    <!-- TAMPILAN FORMULIR UTAMA -->
    <div class="container">
        <h2>Isi Data CV Anda</h2>
        <form id="cvForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="inputNama" required placeholder="Contoh: Budi Santoso">
            </div>
            <div class="form-group">
                <label>Nomor Telepon / Kontak</label>
                <input type="text" id="inputKontak" required placeholder="Contoh: 08123456789 | budi@email.com">
            </div>
            <div class="form-group">
                <label>Tentang Saya (Profil)</label>
                <textarea id="inputTentang" rows="3" placeholder="Ceritakan singkat latar belakang profesional Anda..."></textarea>
            </div>
            <div class="form-group">
                <label>Pengalaman Kerja / Organisasi</label>
                <textarea id="inputKerja" rows="5" placeholder="• Posisi - Nama Perusahaan (Tahun)&#10;  Deskripsi singkat tugas Anda..."></textarea>
            </div>
            <button type="button" onclick="generatePDF()">Cetak CV ke PDF</button>
        </form>
    </div>

    <!-- STRUKTUR TEMPLATE CV YANG AKAN DI-RENDER KE PDF -->
    <div id="cv-template">
        <div class="cv-header">
            <h1 id="pdfNama"></h1>
            <p id="pdfKontak"></p>
        </div>
        <div class="cv-section">
            <h3>Profil Profesional</h3>
            <p id="pdfTentang"></p>
        </div>
        <div class="cv-section">
            <h3>Pengalaman Kerja & Organisasi</h3>
            <p id="pdfKerja"></p>
        </div>
    </div>

    <script>
        function generatePDF() {
            const nama = document.getElementById('inputNama').value;
            const kontak = document.getElementById('inputKontak').value;
            const tentang = document.getElementById('inputTentang').value;
            const kerja = document.getElementById('inputKerja').value;

            if(!nama || !kontak) {
                alert("Mohon isi Nama Lengkap dan Kontak Anda terlebih dahulu!");
                return;
            }

            // Memasukkan input data form ke template PDF
            document.getElementById('pdfNama').innerText = nama;
            document.getElementById('pdfKontak').innerText = kontak;
            document.getElementById('pdfTentang').innerText = tentang;
            document.getElementById('pdfKerja').innerText = kerja;

            const element = document.getElementById('cv-template');
            element.style.display = 'block'; // Tampilkan elemen target cetak

            const opsi = {
                margin:       15,
                filename:     'CV_' + nama.replace(/\s+/g, '_') + '.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // Menjalankan proses konversi HTML ke berkas PDF terunduh
            html2pdf().set(opsi).from(element).save().then(() => {
                element.style.display = 'none'; // Sembunyikan kembali setelah selesai download
            });
        }
    </script>
</body>
</html>
