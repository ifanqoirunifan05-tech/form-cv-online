
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembuat CV Teman Dekat</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f4f9;color:#172033;margin:0;padding:15px}
.container{max-width:760px;margin:auto}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
h1{font-size:25px;margin-top:0;color:#164e9a}
h2{font-size:18px;margin-top:25px;color:#164e9a}
p{line-height:1.5}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ccd4e0;border-radius:8px;font:inherit}
textarea{min-height:90px}
button{border:0;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer}
.primary{background:#1764cf;color:white}
.secondary{background:#e7edf7;color:#18375f}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.actions button{flex:1}
.note{font-size:13px;color:#5a6474}
@media print{
body{background:white;padding:0}
.no-print{display:none!important}
.card{box-shadow:none}
input,textarea{border:0;padding:2px}
}
</style>
</head>
<body>
<div class="container">
<section class="card">
<h1>📄 Pembuat CV Online</h1>
<p>Isi formulir berikut untuk membuat CV. Setelah selesai, unduh sebagai Word atau simpan sebagai PDF.</p>

<form id="cvForm">
<label>Nama lengkap *</label>
<input id="nama" required placeholder="Masukkan nama lengkap">

<label>Nomor HP / WhatsApp</label>
<input id="hp" placeholder="08xxxxxxxxxx">

<label>Email</label>
<input id="email" type="email" placeholder="nama@email.com">

<label>Alamat / Domisili</label>
<input id="alamat" placeholder="Kota, provinsi">

<label>Posisi yang dilamar</label>
<input id="posisi" placeholder="Contoh: Teknisi Telekomunikasi">

<label>Profil singkat</label>
<textarea id="profil" placeholder="Ceritakan pengalaman dan kemampuanmu"></textarea>

<label>Pendidikan terakhir</label>
<textarea id="pendidikan" placeholder="Nama sekolah, jurusan, tahun lulus"></textarea>

<label>Pengalaman kerja</label>
<textarea id="pengalaman" placeholder="Perusahaan, jabatan, proyek, dan periode kerja"></textarea>

<label>Keahlian</label>
<textarea id="keahlian" placeholder="Contoh: Instalasi, troubleshooting, jaringan"></textarea>

<label>Sertifikat / Pelatihan</label>
<textarea id="sertifikat" placeholder="Nama sertifikat dan tahun"></textarea>

<label>Bahasa</label>
<textarea id="bahasa" placeholder="Contoh: Bahasa Indonesia"></textarea>

<div class="actions no-print">
<button type="button" class="primary" onclick="unduhWord()">Unduh Word</button>
<button type="button" class="secondary" onclick="simpanPDF()">Simpan PDF</button>
<button type="reset" class="secondary">Reset</button>
</div>
</form>
<p class="note">Data formulir diproses di browser ini dan tidak dikirim ke server oleh kode ini.</p>
</section>
</div>

<script>
function ambilData(){
 const nama=document.getElementById('nama').value.trim();
 if(!nama){
  alert('Nama lengkap wajib diisi.');
  document.getElementById('nama').focus();
  return null;
 }
 const ids=['nama','hp','email','alamat','posisi','profil',
 'pendidikan','pengalaman','keahlian','sertifikat','bahasa'];
 const data={};
 ids.forEach(id=>{
  data[id]=document.getElementById(id).value.trim();
 });
 return data;
}

function aman(teks){
 return teks.replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;',
  '"':'&quot;',"'":'&#39;'}[c];
 });
}

function bagian(judul,isi){
 if(!isi)return '';
 return '<h2>'+judul+'</h2><p>'+
 aman(isi).replace(/\n/g,'<br>')+'</p>';
}

function dokumen(d){
 return `<!DOCTYPE html>
 <html lang="id"><head><meta charset="UTF-8">
 <style>
 body{font-family:Arial,sans-serif;color:#222;margin:35px;line-height:1.5}
 h1{color:#174b86;font-size:26px}
 h2{font-size:16px;color:#174b86;border-bottom:1px solid #bbb;padding-bottom:4px;margin-top:22px}
 .info{color:#555}
 </style></head><body>
 <h1>${aman(d.nama)}</h1>
 <p class="info">${[d.posisi,d.hp,d.email,d.alamat].filter(Boolean).map(aman).join(' | ')}</p>
 ${bagian('PROFIL SINGKAT',d.profil)}
 ${bagian('PENDIDIKAN',d.pendidikan)}
 ${bagian('PENGALAMAN KERJA',d.pengalaman)}
 ${bagian('KEAHLIAN',d.keahlian)}
 ${bagian('SERTIFIKAT / PELATIHAN',d.sertifikat)}
 ${bagian('BAHASA',d.bahasa)}
 </body></html>`;
}

function unduhWord(){
 const d=ambilData();
 if(!d)return;
 const blob=new Blob(['\ufeff',dokumen(d)],
 {type:'application/msword'});
 const link=document.createElement('a');
 link.href=URL.createObjectURL(blob);
 link.download='CV-'+d.nama.replace(/[^a-z0-9_-]/gi,'_')+'.doc';
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(link.href),2000);
}

function simpanPDF(){
 const d=ambilData();
 if(!d)return;
 const jendela=window.open('','_blank');
 if(!jendela){
  alert('Pop-up diblokir. Izinkan pop-up di browser lalu coba lagi.');
  return;
 }
 jendela.document.open();
 jendela.document.write(dokumen(d));
 jendela.document.close();
 setTimeout(()=>{
  jendela.focus();
  jendela.print();
 },500);
}
</script>
</body>
</html>
