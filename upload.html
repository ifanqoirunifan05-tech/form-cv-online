
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload Berkas - Ifan Qoirun</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf1f2;color:#263638;font-family:Arial,sans-serif}
header{background:#496367;color:white;padding:22px}
main{max-width:700px;margin:20px auto;padding:0 12px}
.card{background:white;padding:20px;margin-bottom:16px;border-radius:12px}
h1{font-size:24px;margin:0 0 8px}
h2{font-size:19px}
label{display:block;font-weight:bold;font-size:14px;margin:14px 0 7px}
input,select{width:100%;padding:12px;border:1px solid #ccd5d6;border-radius:8px;font-size:15px}
button,.btn{border:0;border-radius:8px;padding:12px;background:#496367;color:white;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block}
.primary{width:100%;margin-top:14px}
.secondary{background:#e8eeee;color:#30494c}
.danger{background:#a83232}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{flex:1}
.note{font-size:13px;line-height:1.6;color:#5c6d6f}
.item{border:1px solid #dce3e4;border-radius:9px;padding:13px;margin-top:12px}
.filename{font-weight:bold;overflow-wrap:anywhere}
.meta{font-size:12px;color:#687779;margin-top:6px;line-height:1.6}
#app{display:none}
#status{font-size:13px;overflow-wrap:anywhere;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Upload Berkas</h1>
  CV Online — Ifan Qoirun
</header>

<main>
  <section class="card" id="loginCard">
    <h2>Login / Daftar Akun</h2>
    <p class="note">Masuk dengan email dan kata sandi untuk menyimpan berkas secara online.</p>
    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Kata sandi</label>
      <input id="password" type="password" minlength="6"
             autocomplete="current-password" required>
      <button class="primary" type="submit" id="loginBtn">Login</button>
      <button class="primary secondary" type="button" id="registerBtn">
        Daftar akun baru
      </button>
    </form>
    <p id="authStatus" role="status" class="note"></p>
  </section>

  <div id="app">
    <section class="card">
      <p id="userInfo" class="note"></p>
      <button id="logoutBtn" class="secondary">Keluar</button>
    </section>

    <section class="card">
      <h2>Tambah Berkas</h2>
      <form id="uploadForm">
        <label for="category">Jenis berkas</label>
        <select id="category" required>
          <option>KTP</option>
          <option>Ijazah</option>
          <option>Sertifikat K3 Umum</option>
          <option>Sertifikat lainnya</option>
          <option>CV</option>
          <option>Surat lamaran</option>
          <option>Dokumen lainnya</option>
        </select>

        <label for="file">Pilih file PDF/JPG/PNG</label>
        <input id="file" type="file"
          accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
          required>
        <p class="note">Maksimal 10 MB per berkas.</p>
        <button class="primary" type="submit" id="uploadBtn">
          Upload ke Online
        </button>
      </form>
      <p id="status" role="status"></p>
    </section>

    <section class="card">
      <h2>Berkas Saya</h2>
      <button id="refreshBtn" class="secondary">Muat ulang daftar</button>
      <div id="fileList" class="note">Memuat...</div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getStorage, ref, uploadBytes, listAll,
  getMetadata, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-storage.js";

/* GANTI konfigurasi di bawah dengan milikmu dari Firebase Console */
const firebaseConfig = {
  apiKey: "GANTI_DENGAN_API_KEY",
  authDomain: "GANTI_DENGAN_PROJECT_ID.firebaseapp.com",
  projectId: "GANTI_DENGAN_PROJECT_ID",
  storageBucket: "GANTI_DENGAN_STORAGE_BUCKET",
  messagingSenderId: "GANTI_DENGAN_MESSAGING_SENDER_ID",
  appId: "GANTI_DENGAN_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);
let currentUser = null;
let busy = false;

function message(id, text, error = false) {
  $(id).textContent = text;
  $(id).style.color = error ? "#a83232" : "#315c42";
}

function setBusy(value) {
  busy = value;
  $("uploadBtn").disabled = value;
  $("loginBtn").disabled = value;
  $("registerBtn").disabled = value;
}

function userFolder() {
  if (!currentUser) throw new Error("Silakan login terlebih dahulu.");
  return ref(storage, "users/" + currentUser.uid);
}

function fileType(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) return "application/pdf";
  if (name.endsWith(".jpg") || name.endsWith(".jpeg"))
    return "image/jpeg";
  if (name.endsWith(".png")) return "image/png";
  return null;
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  setBusy(true);
  message("authStatus", "Sedang login...");

  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
    message("authStatus", "Login berhasil.");
  } catch (error) {
    message("authStatus", "Login gagal: " + error.message, true);
  } finally {
    setBusy(false);
  }
});

$("registerBtn").addEventListener("click", async () => {
  if (busy) return;

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 6) {
    message("authStatus",
      "Masukkan email dan kata sandi minimal 6 karakter.", true);
    return;
  }

  setBusy(true);
  message("authStatus", "Mendaftarkan akun...");

  try {
    await createUserWithEmailAndPassword(auth, email, password);
    message("authStatus", "Akun berhasil dibuat.");
  } catch (error) {
    message("authStatus", "Pendaftaran gagal: " + error.message, true);
  } finally {
    setBusy(false);
  }
});

onAuthStateChanged(auth, async user => {
  currentUser = user;
  $("loginCard").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";

  if (user) {
    $("userInfo").textContent = "Login sebagai: " + user.email;
    await renderFiles();
  } else {
    $("fileList").replaceChildren();
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    message("status", "Gagal keluar: " + error.message, true);
  }
});

$("uploadForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser || busy) return;

  const file = $("file").files[0];
  if (!file) {
    message("status", "Pilih berkas terlebih dahulu.", true);
    return;
  }

  const type = fileType(file);
  if (!type) {
    message("status", "Hanya PDF, JPG, JPEG, dan PNG.", true);
    return;
  }

  if (file.size === 0 || file.size > 10 * 1024 * 1024) {
    message("status", "Ukuran file harus 0–10 MB, tidak termasuk 0.", true);
    return;
  }

  setBusy(true);
  message("status", "Mengupload berkas...");

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = "users/" + currentUser.uid + "/" +
      Date.now() + "_" + crypto.randomUUID() + "_" + safeName;

    const fileRef = ref(storage, path);

    await uploadBytes(fileRef, file, {
      contentType: type,
      customMetadata: {
        category: $("category").value
      }
    });

    $("uploadForm").reset();
    message("status", "Upload berhasil disimpan online.");
    await renderFiles();
  } catch (error) {
    console.error(error);
    message("status",
      "Upload gagal: " + error.message +
      ". Periksa konfigurasi Firebase dan Storage Rules.", true);
  } finally {
    setBusy(false);
  }
});

function button(label, className, handler) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.className = className;
  b.addEventListener("click", handler);
  return b;
}

async function renderFiles() {
  if (!currentUser) return;

  const list = $("fileList");
  list.textContent = "Memuat daftar berkas...";

  try {
    const result = await listAll(userFolder());
    list.replaceChildren();

    if (result.items.length === 0) {
      list.textContent = "Belum ada berkas yang diupload.";
      return;
    }

    for (const itemRef of result.items) {
      const metaData = await getMetadata(itemRef);
      const card = document.createElement("article");
      card.className = "item";

      const name = document.createElement("div");
      name.className = "filename";
      name.textContent = itemRef.name;

      const details = document.createElement("div");
      details.className = "meta";
      details.textContent =
        (metaData.customMetadata?.category || "Dokumen") +
        " · " + (metaData.size / 1024).toFixed(1) + " KB";

      const actions = document.createElement("div");
      actions.className = "row";

      actions.append(
        button("Buka", "secondary", async () => {
          try {
            const url = await getDownloadURL(itemRef);
            window.open(url, "_blank", "noopener");
          } catch (error) {
            message("status", "Tidak dapat membuka berkas.", true);
          }
        }),
        button("Unduh", "", async () => {
          try {
            const url = await getDownloadURL(itemRef);
            const a = document.createElement("a");
            a.href = url;
            a.download = itemRef.name;
            a.target = "_blank";
            a.rel = "noopener";
            document.body.appendChild(a);
            a.click();
            a.remove();
          } catch (error) {
            message("status", "Tidak dapat mengunduh berkas.", true);
          }
        }),
        button("Hapus", "danger", async () => {
          if (!confirm("Hapus berkas ini secara permanen?")) return;
          try {
            await deleteObject(itemRef);
            message("status", "Berkas dihapus.");
            await renderFiles();
          } catch (error) {
            message("status", "Gagal menghapus berkas.", true);
          }
        })
      );

      card.append(name, details, actions);
      list.appendChild(card);
    }
  } catch (error) {
    console.error(error);
    list.textContent =
      "Gagal memuat berkas. Periksa koneksi, login, dan Storage Rules.";
  }
}

$("refreshBtn").addEventListener("click", renderFiles);
</script>
</body>
</html>
